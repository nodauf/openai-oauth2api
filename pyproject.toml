[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openai-oauth-proxy"
version = "0.1.0"
description = "OAuth login + OpenAI-compatible proxy that forwards requests to a Codex model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Codex" }]

[project.scripts]
openai-oauth-proxy = "openai_oauth_proxy.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
